<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'base.html' %}
    <title>Register - McAssist</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #fffbe6; /* McDonald's light yellow background */
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Header styling */
        h2 {
            color: #DA291C; /* McDonald's red for the header */
            font-size: 2em;
            font-family: 'Arial Black', sans-serif;
            margin-top: 30px;
        }

        /* Form container styling */
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        /* Input fields styling */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Submit button styling */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #FFC72C; /* McDonald's yellow */
            border: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #FFCC00; /* Slightly darker yellow for hover effect */
        }

        /* Styling for links */
        p {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        a {
            color: #DA291C; /* McDonald's red for link */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Additional button for usability */
        .btn {
            padding: 10px 20px;
            background-color: #FFC72C; /* McDonald's yellow */
            color: #333;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #FFCC00;
        }

        /* Flash message styling */
        .alert {
            background-color: #dff0d8;
            border: 1px solid #d0e9c6;
            color: #3c763d;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
        }

        .alert-danger {
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            color: #a94442;
        }

        .alert-success {
            background-color: #dff0d8;
            border: 1px solid #d0e9c6;
            color: #3c763d;
        }
    </style>
</head>
<body>
    <h2>Register</h2>

    <!-- Display flash messages here -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert">
                {% for category, message in messages %}
                    <p class="alert-{{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST">
        <input type="text" name="full_name" placeholder="Full Name" required>
        <input type="text" name="mobile_number" placeholder="Mobile Number" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="email" name="confirm_email" placeholder="Confirm Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <p>Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>
    <a href="{{ url_for('index') }}" class="btn">Back to Home</a> <!-- Added a button to return to the home page -->
</body>
</html>
