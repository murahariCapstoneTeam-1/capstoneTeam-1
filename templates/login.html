<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'base.html' %}
    <title>Login - McAssist</title>
    <style>
        /* Centralize form container */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            flex-direction: column; /* Ensures content is vertically aligned */
            text-align: center; /* Centers text inside the container */
        }

        h2 {
            color: #DA291C; /* McDonald's red for the main heading */
            font-weight: bold;
            margin-bottom: 20px;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px; /* Makes sure the form is not too wide */
            text-align: center; /* Center the text inside the form */
            margin: 0 auto; /* Ensures the form is centered horizontally */
        }

        input[type="email"],
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #FFC72C; /* McDonald's yellow */
            border: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #FFCC00; /* Slightly darker yellow for hover effect */
        }

        p {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        a {
            color: #DA291C; /* McDonald's red for link */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Flash message styling */
        .alert {
            background-color: #dff0d8;
            border: 1px solid #d0e9c6;
            color: #3c763d;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .alert-danger {
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            color: #a94442;
        }

        .alert-success {
            background-color: #dff0d8;
            border: 1px solid #d0e9c6;
            color: #3c763d;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Display flash messages above the form -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert">
                    {% for category, message in messages %}
                        <p class="alert-{{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('login') }}" method="POST">
            <h2>Login</h2>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>New user? <a href="{{ url_for('register') }}">Register here</a>.</p>
        </form>
    </div>
</body>
</html>
